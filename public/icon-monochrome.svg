<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Frank #0906 round-14 cont.: mask-icon for Safari pinned tabs.
       Safari reads this SVG and applies the page's `color` attribute
       (set in app/layout.tsx <link rel="mask-icon" color="#0a0e1a"/>) to
       all `currentColor` fills. So the same artwork renders correctly
       on a light or dark background by just changing the `color`. -->
  <g fill="currentColor">
    <!-- Globe outline (matches components/LifeFrameLogo.tsx) -->
    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 1.5a8.5 8.5 0 0 1 7.5 4.5h-1.7a7 7 0 0 0-1.4-1.6l1.6-2.9Zm-3.4.4 1.5 2.6a7 7 0 0 0-2 1.5H4.5a8.5 8.5 0 0 1 4.1-4.1ZM4 12v-.5h3.7a7 7 0 0 0-.6 2.5 7 7 0 0 0 .6 2.5H4V12Zm.5 5h3.6a7 7 0 0 0 2 1.5l-1.5 2.6a8.5 8.5 0 0 1-4.1-4.1ZM12 21.5a8.5 8.5 0 0 1-3.4-.7l1.5-2.6a7 7 0 0 0 1.9 0l1.5 2.6a8.5 8.5 0 0 1-1.5.7Zm4-1.6-1.6-2.9a7 7 0 0 0 2-1.5h3.6a8.5 8.5 0 0 1-4 4.4Zm-2-9.4a7 7 0 0 0-.5-2.5h4a7 7 0 0 0-.6 2.5 7 7 0 0 0 .6 2.5h-4a7 7 0 0 0 .5-2.5Z"/>
    <!-- Photo marker dot (replaces the cyan dot in the colored logo —
         the mask-icon is monochrome; on light/dark page chrome the
         `currentColor` dot will be visible because the surrounding
         page bg is the lighter / darker shade. Slight offset from
         center to read as a marker on a globe, not a target. -->
    <circle cx="15" cy="9" r="2.25" />
  </g>
</svg>
